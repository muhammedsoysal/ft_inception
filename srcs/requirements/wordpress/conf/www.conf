[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

/*

user = www-data & group = www-data =
    PHP-FPM süreçlerinin hangi sistem kullanıcısı ve grubu yetkileriyle çalışacağını belirler.
    Linux web sunucu standartlarında dosya izinleri ve güvenlik için www-data kullanıcısı seçilir.

listen = 9000
    PHP-FPM'in hangi port üzerinden gelen istekleri dinleyeceğini belirler.
    Varsayılan unix socket yerine TCP portu olan 9000 verilir. Çünkü WordPress ile NGINX farklı farklı kontyener olarka başaağcaiz 
    NGINX, PHP dosyalarını işletebilmek için ağ üzerinden bu 9000 portuna istel atop bağalanckatır oradan devam edecek dönüşe göre.

listen.owner = www-data & listen.group = www-data
    listen parametresi ile belirlenen portun sahipliğini ve grup yetkilerini ayarlar.
    Bu sayede PHP-FPM, NGINX tarafından gelen istekleri doğru yetkilerle işleyebilir.,

pm = dynamic
    PHP süreçlerinin (process) nasıl yönetileceğini belirler. dynamic seçildiğinde süreçler sabit kalmaz
    gelen trafik miktarına göre otomatik artıp azalır.

pm.max_children = 5
    Aynı anda çalışabilecek maksimum PHP-FPM süreç sayısını belirler. Biz burada 5 olarak ayalardık.
    Yani aynı anda en fazla 5 PHP isteği işlenebilir.


pm.start_servers = 2
    PHP-FPM ilk başlatıldığında varsayılan olarak açılacak hazır süreç sayısıdır.

pm.min_spare_servers = 1
    Boşta (istek beklemede) tutulacak minimum yedek süreç sayısıdır.
    İstek geldiğinde anında yanıt verebilmek için en az 1 süreç hazırda bekler.

pm.max_spare_servers = 3
    Boşta tutulacak maksimum yedek süreç sayısıdır.
    Trafik düştüğünde gereksiz süreçler kapatılır, en fazla 3 yedek süreç açık kalır.

*/