services:
  mariadb:
    build: requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always
  
  wordpress:
    build: requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_root_password
      - db_password
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    restart: always
  
  nginx:
    build: requirements/nginx
    container_name: nginx
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: always

secrets:
  db_root_password:
    file: secrets/db_root_password.txt
  db_password:
    file: secrets/db_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/mysql
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/wordpress

networks:
  inception_network:
    driver: bridge
